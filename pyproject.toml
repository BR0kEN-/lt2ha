[build-system]
requires = [
    "setuptools",
]

[project]
name = "lt2ha"
version = "1.2.0"
requires-python = ">= 3.12"
dependencies = [
    "json-repair==0.55.0",
    "paho-mqtt==2.1.0",
    "websockets==15.0.1"
]

[project.scripts]
lt2ha-bridge = "lt2ha.bridge:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]
